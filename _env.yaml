# 오늘(260827) 실습용으로 버전을 고정했다.
# 이유: 260827 현장에서 파이썬 3.14 + gradio 5 마이너 유동으로 "됐다가 안 됐다가"가
#       다수 발생했다(D28 slack 판독). 아래는 그날 7860에서 정상 실행이 확인된 조합이다.
python_min: "3.10"
python_max: "3.12"        # 3.13/3.14 는 gradio 5 휠 문제로 금지 - 3.11 권장
venv_dir: ".venv"
packages:
  - "gradio==5.14.0"      # 정확히 고정(<6 은 5.x 를 계속 바꿔 재현 불가를 만든다)
  - "huggingface_hub==0.25.2"
  - "google-generativeai==0.8.6"
  - "python-dotenv==1.0.1"
import_check:
  - gradio
  - google.generativeai
  - dotenv
env_file:
  example: ".env.example"
  required_keys:
    - GEMINI_API_KEY
model: "gemini-3.5-flash-lite"
entry: "app.py"
reset: "reset.py"
expect_url: "127.0.0.1"
