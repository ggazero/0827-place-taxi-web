<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대화형 접수 | MEET &amp; RIDE</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #17171c;
      --muted: #93939f;
      --body-muted: #616161;
      --line: #d9d9dd;
      --line-light: #e5e7eb;
      --deep-green: #003c33;
      --dark-navy: #071829;
      --soft-stone: #eeece7;
      --pale-green: #edfce9;
      --pale-blue: #f1f5ff;
      --coral: #ff7759;
      --coral-soft: #ffad9b;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.012em;
    }

    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #4c6ee6;
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100% - 48px, 1320px);
      height: 100vh;
      margin: 0 auto;
      padding: 18px 0 22px;
    }

    .service-header {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      align-items: center;
      gap: 28px;
      min-height: 68px;
      padding: 0 4px 16px;
      border-bottom: 1px solid var(--line-light);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      display: inline-grid;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      place-items: center;
      color: #ffffff;
      background: var(--deep-green);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .brand-text {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .service-copy {
      margin: 0;
      color: var(--body-muted);
      font-size: 0.86rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .mode-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line-light);
      border-radius: 999px;
      background: var(--soft-stone);
    }

    .mode-link {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--body-muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .mode-link:hover { color: var(--text); }

    .mode-link.active {
      color: #ffffff;
      background: var(--text);
    }

    .user-badge {
      padding: 7px 12px;
      border: 1px solid #cde7c7;
      border-radius: 999px;
      color: var(--deep-green);
      background: var(--pale-green);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      gap: 18px;
      min-height: 0;
      padding-top: 18px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line-light);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .chat-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .panel-header {
      padding: 24px 26px 18px;
      border-bottom: 1px solid var(--line-light);
    }

    .section-label {
      margin: 0 0 5px;
      color: var(--deep-green);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    h1, h2 {
      margin: 0;
      font-weight: 520;
      letter-spacing: -0.045em;
    }

    h1 { font-size: clamp(1.65rem, 3vw, 2.2rem); }
    h2 { font-size: 1.18rem; }

    .panel-description {
      margin: 7px 0 0;
      color: var(--body-muted);
      font-size: 0.84rem;
    }

    .message-list {
      display: flex;
      min-height: 0;
      margin: 0;
      padding: 22px 24px;
      overflow-y: auto;
      flex-direction: column;
      gap: 14px;
      list-style: none;
      scroll-behavior: smooth;
    }

    .message-row { display: flex; width: 100%; }
    .message-row.bot { justify-content: flex-start; }
    .message-row.user { justify-content: flex-end; }

    .message-bubble {
      max-width: min(78%, 640px);
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .message-bubble {
      color: var(--deep-green);
      border: 1px solid #cde7c7;
      border-bottom-left-radius: 5px;
      background: var(--pale-green);
    }

    .user .message-bubble {
      color: #ffffff;
      border-bottom-right-radius: 5px;
      background: var(--dark-navy);
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 16px 18px 18px;
      border-top: 1px solid var(--line-light);
      background: #ffffff;
    }

    .chat-input {
      width: 100%;
      min-height: 50px;
      max-height: 120px;
      padding: 13px 15px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: #ffffff;
      line-height: 1.45;
    }

    .chat-input:focus { border-color: var(--deep-green); }

    .send-button,
    .reset-button {
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .send-button {
      min-width: 86px;
      padding: 10px 18px;
      border: 1px solid var(--text);
      color: #ffffff;
      background: var(--text);
    }

    .send-button:hover { background: #000000; }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .status-panel {
      display: flex;
      min-height: 0;
      padding: 24px;
      overflow-y: auto;
      flex-direction: column;
    }

    .status-panel .section-label { color: var(--dark-navy); }

    .progress-list {
      display: grid;
      gap: 8px;
      margin: 20px 0 24px;
      padding: 0;
      list-style: none;
    }

    .progress-item {
      min-height: 36px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 550;
    }

    .progress-button {
      display: grid;
      width: 100%;
      grid-template-columns: 26px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 5px 7px;
      border: 0;
      border-radius: 10px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .progress-button:hover { background: #f7f7f8; }

    .progress-number {
      display: inline-grid;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      place-items: center;
      border: 1px solid var(--line);
      background: #ffffff;
      font-size: 0.7rem;
    }

    .progress-item.active {
      color: var(--deep-green);
      background: var(--pale-green);
      border-radius: 10px;
    }

    .progress-item.active .progress-number {
      border-color: #9cb9a9;
      background: var(--pale-green);
    }

    .progress-item.done .progress-number {
      color: #ffffff;
      border-color: var(--deep-green);
      background: var(--deep-green);
    }

    .record-title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 650;
    }

    .record-guide {
      min-height: 32px;
      margin: 0;
      color: var(--body-muted);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .record-list { display: grid; margin: 0; }

    .record-entry { border-bottom: 1px solid #f0f0f2; }
    .record-entry:last-child { border-bottom: 0; }

    .record-row {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(100px, 0.9fr) minmax(0, 1.1fr);
      align-items: center;
      gap: 12px;
      min-height: 42px;
      padding: 9px 2px;
      border: 0;
      border-radius: 8px;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .record-row.editable { cursor: pointer; }
    .record-row.editable:hover { background: #f7f7f8; }
    .record-row:not(.editable) { cursor: default; }

    .record-label {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .record-value {
      color: var(--dark-navy);
      font-size: 0.86rem;
      font-weight: 600;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .inline-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      padding: 3px 2px 10px;
    }

    .inline-input {
      min-width: 0;
      height: 36px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: #ffffff;
    }

    .inline-input:focus { border-color: var(--deep-green); outline: none; }

    .inline-action {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--body-muted);
      background: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .inline-action.save {
      border-color: var(--deep-green);
      color: #ffffff;
      background: var(--deep-green);
    }

    .reset-button {
      width: 100%;
      min-height: 42px;
      margin-top: auto;
      padding: 9px 16px;
      border: 1px solid var(--coral-soft);
      color: #c54e36;
      background: #ffffff;
    }

    .reset-button:hover {
      border-color: var(--coral);
      color: #9e351f;
      background: #fff7f5;
    }

    .error-note {
      margin: 0 18px 14px;
      padding: 10px 12px;
      border: 1px solid #ffd5cc;
      border-radius: 12px;
      color: #b30000;
      background: #fff7f5;
      font-size: 0.8rem;
    }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      body { overflow: auto; }

      .app-shell {
        width: min(100% - 28px, 760px);
        height: auto;
        min-height: 100vh;
      }

      .service-header {
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      .service-copy { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .chat-panel { min-height: 680px; }
      .status-panel { min-height: 520px; }
    }

    @media (max-width: 620px) {
      .app-shell {
        width: min(100% - 20px, 760px);
        padding-top: 10px;
      }

      .service-header {
        align-items: flex-start;
        grid-template-columns: 1fr;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
      }

      .panel-header, .status-panel { padding: 20px 18px; }
      .message-list { padding: 18px; }
      .message-bubble { max-width: 88%; }
      .chat-form { grid-template-columns: 1fr; }
      .send-button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="service-header">
      <a class="brand" href="./index.html" aria-label="MEET &amp; RIDE 대화형 접수 홈">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-text">MEET &amp; RIDE</span>
      </a>
      <p class="service-copy">장소 선택부터 택시 이동 정보까지 대화로 접수해 보세요.</p>
      <div class="header-actions">
        <nav class="mode-switch" aria-label="접수 방식 선택">
          <a class="mode-link active" href="./index.html" aria-current="page">대화로 접수</a>
          <a class="mode-link" href="./manual.html">직접 입력</a>
        </nav>
        <div class="user-badge" id="user-identity">사용자</div>
      </div>
    </header>

    <main class="workspace">
      <section class="panel chat-panel" aria-labelledby="chat-title">
        <header class="panel-header">
          <p class="section-label">CONVERSATION</p>
          <h1 id="chat-title">대화형 접수</h1>
          <p class="panel-description">챗봇과 대화하면서 원하는 장소를 정해 보세요.</p>
        </header>
        <ol class="message-list" id="message-list" aria-live="polite" aria-label="대화 내역"></ol>
        <div>
          <p class="error-note" id="chat-error" role="alert" hidden>챗봇 서버에 연결하지 못했습니다. app.py가 실행 중인지 확인해 주세요.</p>
          <form class="chat-form" id="chat-form">
            <textarea class="chat-input" id="chat-input" rows="1" placeholder="메시지를 입력하세요" aria-label="챗봇 메시지"></textarea>
            <button class="send-button" id="send-button" type="submit">보내기</button>
          </form>
        </div>
      </section>

      <aside class="panel status-panel" aria-labelledby="status-title">
        <p class="section-label">CURRENT STATUS</p>
        <h2 id="status-title">현재 진행 단계</h2>
        <p class="panel-description">대화에서 확인된 내용을 실시간으로 표시합니다.</p>
        <ol class="progress-list" aria-label="대화형 접수 진행 단계">
          <li class="progress-item active" data-progress="1"><button class="progress-button" type="button" data-edit-stage="1"><span class="progress-number">1</span><span>장소 정보 확인</span></button></li>
          <li class="progress-item" data-progress="2"><button class="progress-button" type="button" data-edit-stage="2"><span class="progress-number">2</span><span>택시 정보 확인</span></button></li>
          <li class="progress-item" data-progress="3"><button class="progress-button" type="button" data-edit-stage="3"><span class="progress-number">3</span><span>접수 내용 확인</span></button></li>
        </ol>
        <h3 class="record-title">현재까지 기록된 내용</h3>
        <p class="record-guide" id="record-guide">장소 정보 행을 누르면 바로 수정할 수 있습니다.</p>
        <div class="record-list">
          <div class="record-entry" data-record-group="place"><button class="record-row editable" type="button" data-edit-field="장소 종류"><span class="record-label">장소 종류</span><span class="record-value" data-record="장소 종류">-</span></button><div class="inline-editor" data-editor="장소 종류" hidden></div></div>
          <div class="record-entry" data-record-group="place"><button class="record-row editable" type="button" data-edit-field="장소 이름"><span class="record-label">장소 이름</span><span class="record-value" data-record="장소 이름">-</span></button><div class="inline-editor" data-editor="장소 이름" hidden></div></div>
          <div class="record-entry" data-record-group="taxi"><button class="record-row" type="button" data-edit-field="택시 출발지"><span class="record-label">택시 출발지</span><span class="record-value" data-record="택시 출발지">-</span></button><div class="inline-editor" data-editor="택시 출발지" hidden></div></div>
          <div class="record-entry" data-record-group="taxi"><button class="record-row" type="button" data-edit-field="택시 도착지"><span class="record-label">택시 도착지</span><span class="record-value" data-record="택시 도착지">-</span></button><div class="inline-editor" data-editor="택시 도착지" hidden></div></div>
          <div class="record-entry" data-record-group="taxi"><button class="record-row" type="button" data-edit-field="택시 출발시간"><span class="record-label">택시 출발시간</span><span class="record-value" data-record="택시 출발시간">-</span></button><div class="inline-editor" data-editor="택시 출발시간" hidden></div></div>
          <div class="record-entry" data-record-group="taxi"><button class="record-row" type="button" data-edit-field="택시 종류"><span class="record-label">택시 종류</span><span class="record-value" data-record="택시 종류">-</span></button><div class="inline-editor" data-editor="택시 종류" hidden></div></div>
        </div>
        <button class="reset-button" id="reset-chat" type="button">처음부터 다시</button>
      </aside>
    </main>
  </div>

  <script>
    const RECORD_FIELDS = ["장소 종류", "장소 이름", "택시 출발지", "택시 도착지", "택시 출발시간", "택시 종류"];
    const INITIAL_MESSAGE = "안녕하세요. 어떤 걸 하고 싶으세요? 쇼핑, 관람, 체험 중에서 알려 주세요.";
    const messageList = document.querySelector("#message-list");
    const chatForm = document.querySelector("#chat-form");
    const chatInput = document.querySelector("#chat-input");
    const sendButton = document.querySelector("#send-button");
    const chatError = document.querySelector("#chat-error");
    const resetButton = document.querySelector("#reset-chat");
    const recordGuide = document.querySelector("#record-guide");
    const nicknameNames = ["여행콩", "모모", "두리", "하리", "루루"];
    const nicknameStorageKey = "meetRideNickname";

    let history = [];
    let record = Object.fromEntries(RECORD_FIELDS.map((field) => [field, ""]));
    let selectedStage = 1;

    function getSessionNickname() {
      let nickname = sessionStorage.getItem(nicknameStorageKey);
      if (!nicknameNames.includes(nickname)) {
        nickname = nicknameNames[Math.floor(Math.random() * nicknameNames.length)];
        sessionStorage.setItem(nicknameStorageKey, nickname);
      }
      return nickname;
    }

    function appendMessage(role, text) {
      const item = document.createElement("li");
      const bubble = document.createElement("div");
      item.className = `message-row ${role}`;
      bubble.className = "message-bubble";
      bubble.textContent = text;
      item.appendChild(bubble);
      messageList.appendChild(item);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function updateRecord(nextRecord, options = {}) {
      const { followProgress = true } = options;
      record = { ...record, ...nextRecord };
      RECORD_FIELDS.forEach((field) => {
        document.querySelector(`[data-record="${field}"]`).textContent = record[field] || "-";
      });
      updateProgress(followProgress);
    }

    function updateProgress(followProgress = true) {
      const hasPlace = Boolean(record["장소 종류"] || record["장소 이름"]);
      const hasTaxi = Boolean(record["택시 출발지"] && record["택시 도착지"] && record["택시 출발시간"] && record["택시 종류"]);
      const current = hasTaxi ? 3 : hasPlace ? 2 : 1;
      if (followProgress) selectedStage = current;
      document.querySelectorAll("[data-progress]").forEach((item) => {
        const number = Number(item.dataset.progress);
        item.classList.toggle("active", number === selectedStage);
        item.classList.toggle("done", number < current);
        item.querySelector("button").setAttribute("aria-pressed", String(number === selectedStage));
      });
    }

    function closeInlineEditors() {
      document.querySelectorAll("[data-editor]").forEach((editor) => {
        editor.hidden = true;
        editor.replaceChildren();
      });
    }

    function setEditStage(stage) {
      selectedStage = stage;
      closeInlineEditors();
      const editableGroup = stage === 1 ? "place" : stage === 2 ? "taxi" : "";
      document.querySelectorAll("[data-edit-field]").forEach((button) => {
        const isEditable = button.closest("[data-record-group]").dataset.recordGroup === editableGroup;
        button.classList.toggle("editable", isEditable);
        button.setAttribute("aria-disabled", String(!isEditable));
      });
      recordGuide.textContent = stage === 1
        ? "장소 정보 행을 누르면 바로 수정할 수 있습니다."
        : stage === 2
          ? "택시 정보 행을 누르면 바로 수정할 수 있습니다."
          : "현재까지 입력된 전체 내용을 확인할 수 있습니다.";
      updateProgress(false);
    }

    function openInlineEditor(field) {
      const button = document.querySelector(`[data-edit-field="${field}"]`);
      if (!button.classList.contains("editable")) return;
      const editor = document.querySelector(`[data-editor="${field}"]`);
      const currentValue = record[field] || "";
      closeInlineEditors();

      const input = document.createElement("input");
      const saveButton = document.createElement("button");
      const cancelButton = document.createElement("button");
      input.className = "inline-input";
      input.type = "text";
      input.value = currentValue;
      input.setAttribute("aria-label", `${field} 수정`);
      saveButton.className = "inline-action save";
      saveButton.type = "button";
      saveButton.textContent = "저장";
      cancelButton.className = "inline-action";
      cancelButton.type = "button";
      cancelButton.textContent = "취소";

      const save = () => {
        const nextValue = input.value.trim();
        const changes = { [field]: nextValue };
        if (field === "장소 이름" && currentValue && record["택시 도착지"] === currentValue) {
          changes["택시 도착지"] = nextValue;
        }
        updateRecord(changes, { followProgress: false });
        closeInlineEditors();
        button.focus({ preventScroll: true });
      };

      saveButton.addEventListener("click", save);
      cancelButton.addEventListener("click", () => {
        closeInlineEditors();
        button.focus({ preventScroll: true });
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.isComposing) {
          event.preventDefault();
          save();
        }
        if (event.key === "Escape") cancelButton.click();
      });

      editor.append(input, saveButton, cancelButton);
      editor.hidden = false;
      input.focus({ preventScroll: true });
      input.select();
    }

    function setBusy(isBusy) {
      chatInput.disabled = isBusy;
      sendButton.disabled = isBusy;
      sendButton.textContent = isBusy ? "응답 중" : "보내기";
    }

    async function submitMessage(message) {
      const previousHistory = [...history];
      appendMessage("user", message);
      chatInput.value = "";
      chatError.hidden = true;
      setBusy(true);
      try {
        const response = await fetch("./api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: previousHistory, record })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        appendMessage("bot", result.response);
        history.push({ role: "user", content: message }, { role: "assistant", content: result.response });
        updateRecord(result.record || {});
      } catch (error) {
        console.error(error);
        chatError.hidden = false;
      } finally {
        setBusy(false);
        chatInput.focus({ preventScroll: true });
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message || sendButton.disabled) return;
      submitMessage(message);
    });

    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    document.querySelectorAll("[data-edit-stage]").forEach((button) => {
      button.addEventListener("click", () => setEditStage(Number(button.dataset.editStage)));
    });

    document.querySelectorAll("[data-edit-field]").forEach((button) => {
      button.addEventListener("click", () => openInlineEditor(button.dataset.editField));
    });

    resetButton.addEventListener("click", () => {
      history = [];
      record = Object.fromEntries(RECORD_FIELDS.map((field) => [field, ""]));
      selectedStage = 1;
      messageList.innerHTML = "";
      appendMessage("bot", INITIAL_MESSAGE);
      updateRecord(record);
      chatError.hidden = true;
      chatInput.value = "";
      chatInput.focus({ preventScroll: true });
    });

    document.querySelector("#user-identity").textContent = `사용자: ${getSessionNickname()}`;
    appendMessage("bot", INITIAL_MESSAGE);
    updateRecord(record);
    setEditStage(1);
    chatInput.focus({ preventScroll: true });
  </script>
</body>
</html>
